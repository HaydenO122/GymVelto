<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gymvelto — Gym Profile</title><link rel="stylesheet" href="/styles.css"></head><body>
<nav><a href="/dashboard">Dashboard</a><a href="/members">Members</a><a href="/signup">Sign Up Member</a><a href="/documents">Documents</a><a href="/gym-profile" class="active">Gym Profile</a><a href="/logout">Logout</a></nav>
<main class="container"><h1>Gym Profile</h1><p>Make your dashboard feel like your gym. Gymvelto branding stays in place.</p>
<form id="profile-form"><label for="gym-name">Gym name</label><input id="gym-name" maxlength="100" required><label for="dashboard-title">Dashboard heading</label><input id="dashboard-title" maxlength="100" placeholder="Facility Command Center"><p class="help-text">For example: “Welcome to Iron House” or “Member Headquarters”. Leave blank to use Facility Command Center.</p><button id="save-profile" disabled>Save gym profile</button></form>
<h2>Gym logo</h2><img id="logo-preview" class="gym-logo" alt="Your gym logo" hidden><form id="logo-form"><label for="logo-file">PNG or JPG (up to 1 MB)</label><input id="logo-file" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg" required><button id="save-logo" disabled>Upload logo</button></form><button id="remove-logo" type="button" hidden>Remove logo</button><p id="profile-message" role="status" aria-live="polite"></p><p><a href="/dashboard">View dashboard</a></p></main>
<script src="/app.js"></script><script src="/gym-profile-page.js"></script></body></html>
