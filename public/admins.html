<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gymvelto — Gym Admins</title><link rel="stylesheet" href="/styles.css"></head><body>
<nav><a href="/dashboard">Dashboard</a><a href="/members">Members</a><a href="/signup">Sign Up Member</a><a href="/plans">Plans</a><a href="/admins" class="active">Admins</a><a href="/logout">Logout</a></nav>
<main class="container"><h1>Gym Admins</h1><p>Create an additional login for someone who manages your gym. Admins can manage your gym’s members, plans, documents, and profile.</p>
<h2>Add New Gym Admin</h2><form action="/add-admin" method="POST"><label for="newUsername">New admin username</label><input id="newUsername" name="newUsername" maxlength="100" autocomplete="off" required><label for="newPassword">New admin password</label><input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="200" autocomplete="new-password" required><p class="help-text">Use at least 8 characters. This account will belong to your gym.</p><button>Create Admin Account</button></form></main><script src="/app.js"></script></body></html>
