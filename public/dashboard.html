<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gymvelto - Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }
    .stat-card {
      background-color: #292929;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      border-left: 4px solid #4caf50;
    }
    .stat-card.danger {
      border-left-color: #f44336;
    }
    .stat-card h3 { margin: 0 0 5px; font-size: 0.9em; color: #aaa; }
    .stat-card p { margin: 0; font-size: 1.8em; font-weight: bold; color: #fff; }
    
    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }
    .btn-action {
      background-color: #4caf50;
      color: white;
      padding: 15px;
      text-align: center;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
    .btn-action.scan { background-color: #2196F3; }
    .btn-action.signup { background-color: #ff9800; }

    .admin-card {
      background-color: #222;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      border: 1px solid #333;
    }
    .admin-card h2 {
      margin-top: 0;
      font-size: 1.2em;
      color: #4caf50;
      text-align: left;
    }
  </style>
</head>
<body>
  <nav>
  <a href="/dashboard.html">Dashboard</a>
  <a href="/scan.html">Barcode Scanner</a>
  <a href="/members.html">Members</a>
  <a href="/signup.html">Sign Up Member</a>
  <a href="/plans.html">Plans</a>
  <a href="/logout">Logout</a>
</nav>

  <div class="container" style="max-width: 800px;">
    <div class="gym-dashboard-brand"><img id="gym-dashboard-logo" class="gym-logo" alt="Gym logo" hidden><p id="gym-dashboard-name" hidden></p></div>
    <h1 id="gym-dashboard-title">Facility Command Center</h1>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Members</h3>
        <p id="totalMembers">--</p>
      </div>
      <div class="stat-card">
        <h3>Active Accounts</h3>
        <p id="activeMembers">--</p>
      </div>
      <div class="stat-card danger">
        <h3>Unpaid / Past Due</h3>
        <p id="unpaidMembers">--</p>
      </div>
    </div>

    <h2>Quick Actions</h2>
    <div class="action-grid">
      <a href="/scan" class="btn-action scan">🔍 Scan Barcode</a>
      <a href="/signup" class="btn-action signup">💳 New Sign-Up</a>
      <a href="/members" class="btn-action">📋 View Roster</a>
    </div>

    <h2>Recent Members Roster</h2>
    <table>
      <thead>
        <tr><th>Name</th><th>Barcode ID</th><th>Phone</th><th>Status</th></tr>
      </thead>
      <tbody id="memberPreview"></tbody>
    </table>
  </div>

  <script>
    async function loadDashboardData() {
      try {
        const response = await fetch('/api/members');
        const members = await response.json();

        document.getElementById('totalMembers').textContent = members.length;
        document.getElementById('activeMembers').textContent = members.filter(m => m.status === 'active').length;
        document.getElementById('unpaidMembers').textContent = members.filter(m => m.status === 'unpaid').length;

        const tbody = document.getElementById('memberPreview');
        tbody.innerHTML = '';
        members.slice(0, 5).forEach(m => {
          const tr = document.createElement('tr');
          const isGreen = m.status === 'active';
          [m.fullName,m.barcode || 'N/A',m.phone || '-',(m.status || 'unpaid').toUpperCase()].forEach((value,index) => {
            const td=document.createElement('td');td.textContent=value;
            if(index===3) td.style.color=isGreen ? '#4caf50' : '#f44336';
            tr.append(td);
          });
          tbody.appendChild(tr);
        });
      } catch (e) {
        console.error(e);
      }
    }
    loadDashboardData();
  </script>
  <script src="/app.js"></script>
</body>
</html>
