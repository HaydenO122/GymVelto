<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gymvelto - Admin Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Gymvelto Admin Login</h1>
    <form action="/login" method="POST">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" maxlength="100" placeholder="Enter Admin Username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" maxlength="72" placeholder="Enter Password" required />

      <button type="submit">Login to Portal</button>
    </form><p class="help-text">Beta access is provided separately for each gym. <a href="mailto:gymvelto@gmail.com">Request access or sign-in help</a>.</p>
  </div>
    <script src="/app.js"></script>
</body>
</html>
